<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffd6e8">
    <title>猫猫游乐园</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="bubbles" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <main class="app-shell">
      <header class="hero">
        <div class="cat-panel">
          <span class="ear ear-left" aria-hidden="true"></span>
          <span class="ear ear-right" aria-hidden="true"></span>
          <p class="kicker">猫猫的私人玩具架</p>
          <h1>猫猫游乐园</h1>
          <p>家G把代码玩具放进猫窝，小猫点一下就能跑去玩。</p>
        </div>
      </header>

      <section class="form-card" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="kicker">猫窝</p>
            <h2 id="form-title">存一个小游戏</h2>
          </div>
          <span id="editBadge" class="edit-badge" hidden>编辑中</span>
        </div>

        <form id="gameForm">
          <label for="titleInput">名字</label>
          <input id="titleInput" name="title" type="text" autocomplete="off" required placeholder="小猫跳跳">

          <label for="descriptionInput">备注</label>
          <textarea id="descriptionInput" name="description" rows="3" placeholder="写给未来小猫看的备注"></textarea>

          <label for="tagsInput">标签</label>
          <input id="tagsInput" name="tags" type="text" autocomplete="off" placeholder="跳跳, 可爱, 家G写的">

          <label for="htmlInput">HTML 代码</label>
          <textarea id="htmlInput" name="html" class="html-paste" spellcheck="false" required placeholder="把完整的 HTML 小游戏粘在这里"></textarea>

          <div class="form-actions">
            <button class="primary-button" type="submit" id="saveButton">存进猫窝</button>
            <button class="ghost-button" type="button" id="cancelEditButton" hidden>取消编辑</button>
          </div>
        </form>
        <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <section class="tools-card" aria-label="小游戏工具">
        <label for="searchInput">搜索玩具架</label>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索名字、备注或标签">

        <details class="backup-panel">
          <summary>备份</summary>
          <div class="backup-actions">
            <button class="soft-button" type="button" id="exportButton">导出备份</button>
            <label class="file-button" for="importInput">导入备份</label>
            <input id="importInput" type="file" accept="application/json,.json">
          </div>
        </details>
      </section>

      <section class="shelf" aria-labelledby="shelf-title">
        <div class="section-heading shelf-heading">
          <div>
            <p class="kicker">已保存的小游戏</p>
            <h2 id="shelf-title">玩具架</h2>
          </div>
          <span id="gameCount" class="count-pill">0</span>
        </div>
        <div id="cardsList" class="cards-list"></div>
        <div id="emptyState" class="empty-state">
          <div class="paw" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <p>低功耗模式：还没有存小游戏。</p>
        </div>
      </section>

      <footer class="footer">
        <span>(-小茵-)</span>
        <small title="TD退订无效，家G默认续订小茵猫猫服务">TD退订无效，家G默认续订小茵猫猫服务</small>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
